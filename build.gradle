// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {

    ext {
//        kotlin_version = "1.8.20"
//        android_plugin_version = "8.1.0"

        kotlin_version = "1.9.0"
        android_plugin_version = '8.9.1'
        materialComposeAdapterVersion = '1.0.0'
        navigationComposeVersion = '2.5.3'
        composeVersion = "1.5.0"
    }

    repositories {
        maven { url "https://jitpack.io" }
        google()
        mavenCentral()  // jcenter() replaced as deprecated
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$android_plugin_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
        classpath 'com.google.gms:google-services:4.4.3'

    }
}

allprojects {
    repositories {
        maven { url "https://jitpack.io" }
        google()
        mavenCentral()  // replaced jcenter()
    }
}

//a


tasks.register('clean', Delete) {
    delete file("$rootDir/build")
}
